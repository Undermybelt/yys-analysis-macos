name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: macOS 质量基线
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 检查前端
        run: npm run check

      - name: 检查发布清单工具
        run: node --check tools/update-manifest.mjs

      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check

      - name: 运行 Rust 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

      - name: 运行 Rust 测试
        run: cargo test --workspace
