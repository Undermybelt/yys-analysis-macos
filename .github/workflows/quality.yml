name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: 前后端质量基线
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 检查前端
        run: npm run check

      # 发布清单工具不属于前端类型检查范围，但必须在质量流水线中保持可执行。
      - name: 检查发布清单工具
        run: node --check tools/update-manifest.mjs

      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check

      - name: 运行 Rust 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 运行 Rust 测试
        run: cargo test --workspace

  package-windows:
    name: 验证 Windows 安装包
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: npm ci

      # 手动工作流生成 NSIS 安装包，便于在发布签名前验证完整打包链路。
      - name: 生成 Windows 安装包
        run: npm run tauri -- build --bundles nsis
